# Experiment (NOT part of the product): a real Chromium streamed over WebRTC with neko, to measure what it costs on the VPS.
# See README.md. Replace PUBLIC_IP with the public address of the VPS before starting.
services:
  neko:
    image: ghcr.io/m1k1o/neko/chromium:latest
    container_name: neko-spike
    restart: "no"
    shm_size: "2gb"
    ports:
      - "8080:8080"
      - "52000-52100:52000-52100/udp"
      # The DevTools port (9222) is NOT published: Chromium listens only inside the container. Programs reach it through the container's own network
      # (docker run --network container:neko-spike ...), which keeps it off the host and off the internet.
    volumes:
      - ./chromium.conf:/etc/neko/supervisord/chromium.conf:ro
    environment:
      NEKO_DESKTOP_SCREEN: 1280x720@30
      NEKO_WEBRTC_EPR: 52000-52100
      NEKO_WEBRTC_NAT1TO1: PUBLIC_IP
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: user-spike
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: admin-spike
