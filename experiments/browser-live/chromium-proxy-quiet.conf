; Copy for the production machine (variants/prod-host.yml): the same file plus --proxy-server, so every request of the browser goes through the egress
; proxy of browser-host (the only way out of the browser network). 172.29.0.1:40001 are BROWSER_NET_GATEWAY and EGRESS_PORT of /etc/noureon-browser/host.env.
; The stock supervisord file of neko's Chromium image (apps/chromium/supervisord.conf), with two flags added so that a program can drive the
; same browser over the Chrome DevTools Protocol: --remote-debugging-port and --remote-allow-origins.
[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/chromium
  --proxy-server=http://172.29.0.1:40001
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/home/neko/.config/chromium
  --no-first-run
  --start-maximized
  --bwsi
  --force-dark-mode
  --disable-file-system
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
  --disable-background-networking
  --disable-component-update
  --disable-default-apps
  --no-pings
  --remote-debugging-port=9222
  --remote-allow-origins=*
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
